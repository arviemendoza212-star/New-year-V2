<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Firework Simulator v2 - Ultra Quality Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="shortcut icon" type="image/png" href="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/firework-burst-icon-v2.png">
    <link rel="icon" type="image/png" href="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/firework-burst-icon-v2.png">
    <link rel="apple-touch-icon-precomposed" href="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/firework-burst-icon-v2.png">
    <meta name="msapplication-TileColor" content="#000000">

    <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">
    
    <style>
      * {
        position: relative;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      html {
        background-color: #000;
      }

      body {
        overflow: hidden;
        color: rgba(255, 255, 255, 0.5);
        font-family: "Russo One", arial, sans-serif;
        line-height: 1.25;
        letter-spacing: 0.06em;
      }

      .hide {
        opacity: 0;
        visibility: hidden;
      }

      .remove {
        display: none !important;
      }

      .blur {
        filter: blur(12px);
      }

      .container {
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .stage-container {
        overflow: hidden;
        box-sizing: initial;
        border: 1px solid #222;
        margin: -1px;
      }
      @media (max-width: 840px) {
        .stage-container {
          border: none;
          margin: 0;
        }
      }

      .canvas-container {
        width: 100%;
        height: 100%;
        transition: filter 0.3s;
      }
      .canvas-container canvas {
        position: absolute;
        mix-blend-mode: lighten;
        transform: translateZ(0);
      }

      .controls {
        position: absolute;
        top: 0;
        width: 100%;
        padding-bottom: 50px;
        display: flex;
        justify-content: space-between;
        transition: opacity 0.3s, visibility 0.3s;
      }

      /* Hide the fireworks controls automatically once the fireworks start.
         This only changes their visibility; the existing controls/settings system remains intact. */
      .controls.fireworks-active {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
      @media (min-width: 840px) {
        .controls {
          visibility: visible;
        }
        .controls.hide:hover {
          opacity: 1;
        }
      }

      .menu {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: rgba(0, 0, 0, 0.42);
        transition: opacity 0.3s, visibility 0.3s;
      }
      .menu__inner-wrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        transition: opacity 0.3s;
      }
      .menu__header {
        margin-top: auto;
        margin-bottom: 8px;
        padding-top: 16px;
        font-size: 2em;
        text-transform: uppercase;
      }
      .menu__subheader {
        margin-bottom: auto;
        padding-bottom: 12px;
        font-size: 0.86em;
        opacity: 0.8;
      }
      .menu form {
        width: 100%;
        max-width: 400px;
        padding: 0 10px;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
      .menu .form-option {
        display: flex;
        align-items: center;
        margin: 16px 0;
        transition: opacity 0.3s;
      }
      .menu .form-option label {
        display: block;
        width: 50%;
        padding-right: 12px;
        text-align: right;
        text-transform: uppercase;
        -webkit-user-select: none;
           -moz-user-select: none;
            -ms-user-select: none;
                user-select: none;
      }
      .menu .form-option--select select {
        display: block;
        width: 50%;
        height: 30px;
        font-size: 1rem;
        font-family: "Russo One", arial, sans-serif;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.06em;
        background-color: transparent;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .menu .form-option--select select option {
        background-color: black;
      }
      .menu .form-option--checkbox input {
        display: block;
        width: 26px;
        height: 26px;
        margin: 0;
        opacity: 0.5;
      }
      @media (max-width: 840px) {
        .menu .form-option select, .menu .form-option input {
          outline: none;
        }
      }

      .close-menu-btn {
        position: absolute;
        top: 0;
        right: 0;
      }

      .btn {
        opacity: 0.16;
        width: 50px;
        height: 50px;
        display: flex;
        -webkit-user-select: none;
           -moz-user-select: none;
            -ms-user-select: none;
                user-select: none;
        cursor: default;
        transition: opacity 0.3s;
      }
      .btn--bright {
        opacity: 0.5;
      }
      @media (min-width: 840px) {
        .btn:hover {
          opacity: 0.32;
        }
        .btn--bright:hover {
          opacity: 0.75;
        }
      }
      .btn svg {
        display: block;
        margin: auto;
      }

      .credits {
        margin-top: auto;
        margin-bottom: 10px;
        padding-top: 6px;
        font-size: 0.8em;
        opacity: 0.75;
      }
      .credits a {
        color: rgba(255, 255, 255, 0.5);
        text-decoration: none;
      }
      .credits a:hover, .credits a:active {
        color: rgba(255, 255, 255, 0.75);
        text-decoration: underline;
      }

      .help-modal {
        display: flex;
        justify-content: center;
        align-items: center;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        visibility: hidden;
        transition-property: visibility;
        transition-duration: 0.25s;
      }
      .help-modal__overlay {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        opacity: 0;
        transition-property: opacity;
        transition-timing-function: ease-in;
        transition-duration: 0.25s;
      }
      .help-modal__dialog {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 400px;
        max-height: calc(100vh - 100px);
        margin: 10px;
        padding: 20px;
        border-radius: 0.3em;
        background-color: rgba(0, 0, 0, 0.4);
        opacity: 0;
        transform: scale(0.9, 0.9);
        transition-property: opacity, transform;
        transition-timing-function: ease-in;
        transition-duration: 0.25s;
      }
      @media (min-width: 840px) {
        .help-modal__dialog {
          font-size: 1.25rem;
          max-width: 500px;
        }
      }
      .help-modal__header {
        font-size: 1.75em;
        text-transform: uppercase;
        text-align: center;
      }
      .help-modal__body {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        margin: 1em 0;
        padding: 1em 0;
        border-top: 1px solid rgba(255, 255, 255, 0.25);
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.75);
      }
      .help-modal__close-btn {
        flex-shrink: 0;
        outline: none;
        border: none;
        border-radius: 2px;
        padding: 0.25em 0.75em;
        margin-top: 0.36em;
        font-family: "Russo One", arial, sans-serif;
        font-size: 1em;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        background-color: rgba(255, 255, 255, 0.25);
        transition: color 0.3s, background-color 0.3s;
      }
      .help-modal__close-btn:hover, .help-modal__close-btn:active, .help-modal__close-btn:focus {
        color: #FFF;
        background-color: #09F;
      }
      .help-modal.active {
        visibility: visible;
        transition-duration: 0.4s;
      }
      .help-modal.active .help-modal__overlay {
        opacity: 1;
        transition-timing-function: ease-out;
        transition-duration: 0.4s;
      }
      .help-modal.active .help-modal__dialog {
        opacity: 1;
        transform: scale(1, 1);
        transition-timing-function: ease-out;
        transition-duration: 0.4s;
      }

      /* Ultimate Stylish Countdown Overlay */
      #countdown-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(15,15,30,0.95) 0%, rgba(0,0,0,0.98) 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
      }

      #countdown-number {
        font-size: clamp(2.5rem, 6vw, 5rem);
        color: #fff;
        text-align: center;
        text-shadow: 0 0 20px rgba(255, 0, 67, 0.8), 0 0 40px rgba(20, 252, 86, 0.6), 0 0 60px rgba(30, 127, 255, 0.8);
        padding: 0 20px;
      }

      #countdown-label {
        margin-top: 15px;
        font-size: clamp(1rem, 3vw, 1.8rem);
        color: rgba(255, 255, 255, 0.7);
        text-transform: uppercase;
        letter-spacing: 0.3em;
      }

      /* Stylish Happy New Year Text Animation */
      #hnyk-banner {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99998;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1s ease-in-out;
      }

      #hnyk-banner.show {
        opacity: 1;
      }

      /* Stylish Welcome 2027 Text Animation */
      #welcome-banner {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99998;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1s ease-in-out;
      }

      #welcome-banner.show {
        opacity: 1;
      }

      .hnyk-text {
        font-size: clamp(2.5rem, 7vw, 7rem);
        text-align: center;
        background: linear-gradient(45deg, #ff0043, #ffbf36, #14fc56, #e60aff, #1e7fff);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbowGlow 4s ease infinite, bounceText 1.5s ease infinite alternate;
        text-shadow: 0 0 30px rgba(255,255,255,0.4);
      }

      @keyframes rainbowGlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes bounceText {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(-10px) scale(1.03); }
      }
    
      /* PREMIUM NEW YEAR COUNTDOWN DESIGN */
      #countdown-overlay {
        background:
          radial-gradient(circle at 50% 45%, rgba(35, 20, 75, 0.55) 0%, rgba(3, 5, 18, 0.96) 45%, #000 100%);
        overflow: hidden;
        isolation: isolate;
      }

      #countdown-overlay::before {
        content: "";
        position: absolute;
        inset: -25%;
        background:
          radial-gradient(circle at 20% 30%, rgba(0, 174, 255, 0.16), transparent 24%),
          radial-gradient(circle at 80% 65%, rgba(255, 0, 128, 0.14), transparent 26%),
          radial-gradient(circle at 50% 50%, rgba(255, 196, 58, 0.08), transparent 35%);
        animation: countdownAurora 10s ease-in-out infinite alternate;
        z-index: -2;
      }

      #countdown-overlay::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
          radial-gradient(circle, rgba(255,215,90,.65) 0 1px, transparent 1.5px);
        background-size: 83px 83px, 137px 137px;
        background-position: 8px 13px, 42px 71px;
        opacity: .32;
        animation: starDrift 18s linear infinite;
        z-index: -1;
        pointer-events: none;
      }

      #countdown-overlay > * {
        z-index: 1;
      }

      #countdown-label {
        order: -1;
        margin: 0 0 18px;
        padding: 8px 20px;
        border: 1px solid rgba(255, 210, 90, .5);
        border-radius: 999px;
        background: rgba(255, 255, 255, .055);
        box-shadow: 0 0 22px rgba(255, 193, 54, .16), inset 0 0 18px rgba(255,255,255,.035);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: clamp(.72rem, 2vw, 1rem);
        color: rgba(255, 226, 150, .9);
        letter-spacing: .28em;
        text-shadow: 0 0 12px rgba(255, 195, 70, .7);
        animation: labelFloat 2.8s ease-in-out infinite;
      }

      #countdown-number {
        position: relative;
        min-width: min(92vw, 720px);
        padding: clamp(22px, 4vw, 42px) clamp(18px, 5vw, 55px);
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.018));
        box-shadow:
          0 0 0 1px rgba(255, 207, 76, .08),
          0 0 35px rgba(104, 68, 255, .25),
          0 0 90px rgba(0, 170, 255, .12),
          inset 0 0 35px rgba(255,255,255,.025);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-size: clamp(2.15rem, 9vw, 6.8rem);
        font-weight: 400;
        line-height: 1;
        letter-spacing: .035em;
        color: #fff;
        text-shadow:
          0 0 8px rgba(255,255,255,.95),
          0 0 25px rgba(84, 178, 255, .75),
          0 0 55px rgba(180, 75, 255, .55);
        animation: countdownPulse 1s ease-in-out infinite alternate;
      }

      #countdown-number::before,
      #countdown-number::after {
        content: "";
        position: absolute;
        width: 55px;
        height: 55px;
        border-color: rgba(255, 208, 78, .75);
        pointer-events: none;
      }

      #countdown-number::before {
        top: -1px;
        left: -1px;
        border-top: 2px solid;
        border-left: 2px solid;
        border-radius: 28px 0 0 0;
      }

      #countdown-number::after {
        right: -1px;
        bottom: -1px;
        border-right: 2px solid;
        border-bottom: 2px solid;
        border-radius: 0 0 28px 0;
      }

      @keyframes countdownAurora {
        from { transform: rotate(0deg) scale(1); opacity: .7; }
        to { transform: rotate(7deg) scale(1.08); opacity: 1; }
      }

      @keyframes starDrift {
        from { transform: translate3d(0,0,0); }
        to { transform: translate3d(-80px,45px,0); }
      }

      @keyframes countdownPulse {
        from { transform: scale(1); filter: brightness(1); }
        to { transform: scale(1.018); filter: brightness(1.16); }
      }

      @keyframes labelFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      @media (max-width: 640px) {
        #countdown-number {
          min-width: 90vw;
          border-radius: 22px;
          padding: 28px 12px;
          letter-spacing: .01em;
        }
        #countdown-number::before,
        #countdown-number::after {
          width: 35px;
          height: 35px;
        }
        #countdown-label {
          max-width: 90vw;
          text-align: center;
          letter-spacing: .16em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #countdown-overlay::before,
        #countdown-overlay::after,
        #countdown-number,
        #countdown-label {
          animation: none;
        }
      }

    
/* CITY NIGHT COUNTDOWN BACKGROUND + SMALL FIREWORKS */
#countdown-overlay::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-3;
  background:
    linear-gradient(to bottom, rgba(3,8,25,.35), rgba(2,4,12,.72)),
    url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=2400&q=85") center/cover no-repeat;
  animation: cityNightZoom 18s ease-in-out infinite alternate;
}
#countdown-overlay::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(circle at 16% 27%, rgba(255,210,100,.8) 0 1px, transparent 2px),
    radial-gradient(circle at 72% 20%, rgba(120,190,255,.75) 0 1px, transparent 2px),
    radial-gradient(circle at 42% 35%, rgba(255,255,255,.7) 0 1px, transparent 2px);
  background-size: 120px 95px, 170px 130px, 210px 150px;
  animation: citySparkle 5s linear infinite;
}
#countdown-overlay .city-firework{
  position:absolute;
  width:3px;height:3px;
  border-radius:50%;
  z-index:-1;
  pointer-events:none;
  opacity:.8;
  box-shadow:
    0 -35px 0 1px rgba(255,215,90,.9),
    25px -25px 0 1px rgba(255,100,170,.85),
    35px 0 0 1px rgba(120,210,255,.9),
    25px 25px 0 1px rgba(255,215,90,.8),
    0 35px 0 1px rgba(255,110,120,.85),
    -25px 25px 0 1px rgba(120,210,255,.8),
    -35px 0 0 1px rgba(255,215,90,.9),
    -25px -25px 0 1px rgba(255,110,180,.8);
  animation: miniBurst 2.8s ease-in-out infinite;
}
#countdown-overlay .city-firework:nth-child(1){top:24%;left:18%;animation-delay:.2s;transform:scale(.65)}
#countdown-overlay .city-firework:nth-child(2){top:20%;right:20%;animation-delay:1.3s;transform:scale(.5)}
#countdown-overlay .city-firework:nth-child(3){top:37%;left:72%;animation-delay:2s;transform:scale(.42)}
@keyframes miniBurst{
  0%,100%{opacity:0;transform:scale(.2)}
  20%{opacity:.15}
  45%{opacity:.9;transform:scale(1)}
  70%{opacity:.25;transform:scale(.7)}
}
@keyframes cityNightZoom{
  from{transform:scale(1.02)}
  to{transform:scale(1.07)}
}
@keyframes citySparkle{
  from{transform:translateY(0)}
  to{transform:translateY(28px)}
}

</style>

(function () {
  function autoFullscreen() {
    try {
      if (document.fullscreenElement) return;
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
    } catch (e) {}
  }

  window.addEventListener("load", autoFullscreen);
  document.addEventListener("DOMContentLoaded", autoFullscreen);
})();

<script>
    'use strict';
    console.clear();

    const IS_MOBILE = window.innerWidth <= 640;
    const IS_DESKTOP = window.innerWidth > 800;
    const IS_HEADER = IS_DESKTOP && window.innerHeight < 300;
    
    const IS_HIGH_END_DEVICE = true;

    // Performance guard: keep the existing shell types and effects, but cap
    // the number of secondary spark particles when many shells overlap.
    // This prevents sudden frame drops on phones without removing shell types.
    const MAX_ACTIVE_SPARKS = IS_MOBILE ? 900 : 1600;
    const MAX_ACTIVE_BURST_FLASHES = IS_MOBILE ? 6 : 10;
    
    const MAX_WIDTH = 7680;
    const MAX_HEIGHT = 4320;
    const GRAVITY = 0.9;
    let simSpeed = 1;

    function getDefaultScaleFactor() {
        return 0.70;
    }

    let stageW, stageH;

    let quality = 3;
    let isLowQuality = false;
    let isNormalQuality = false;
    let isHighQuality = true;

    const QUALITY_LOW = 1;
    const QUALITY_NORMAL = 2;
    const QUALITY_HIGH = 3;

    const SKY_LIGHT_NONE = 0;
    const SKY_LIGHT_DIM = 1;
    const SKY_LIGHT_NORMAL = 2;

    const COLOR = {
        Red: '#ff0043',
        Green: '#14fc56',
        Blue: '#1e7fff',
        Purple: '#e60aff',
        Gold: '#ffbf36',
        White: '#ffffff'
    };

    const INVISIBLE = '_INVISIBLE_';

    const PI_2 = Math.PI * 2;
    const PI_HALF = Math.PI * 0.5;

    const trailsStage = new Stage('trails-canvas');
    const mainStage = new Stage('main-canvas');
    const stages = [
        trailsStage,
        mainStage
    ];

    function fullscreenEnabled() {
        return fscreen.fullscreenEnabled;
    }

    function isFullscreen() {
        return !!fscreen.fullscreenElement;
    }

    function toggleFullscreen() {
        if (fullscreenEnabled()) {
            if (isFullscreen()) {
                fscreen.exitFullscreen();
            } else {
                fscreen.requestFullscreen(document.documentElement);
            }
        }
    }

    fscreen.addEventListener('fullscreenchange', () => {
        store.setState({ fullscreen: isFullscreen() });
    });

    const store = {
        _listeners: new Set(),
        _dispatch(prevState) {
            this._listeners.forEach(listener => listener(this.state, prevState))
        },
        
        state: {
            paused: true,
            soundEnabled: true,
            menuOpen: false,
            openHelpTopic: null,
            fullscreen: isFullscreen(),
            config: {
                quality: String(QUALITY_HIGH),
                shell: 'Random',
                size: '0',
                autoLaunch: true,
                finale: true,
                skyLighting: SKY_LIGHT_NORMAL + '',
                hideControls: IS_HEADER,
                longExposure: false,
                scaleFactor: getDefaultScaleFactor()
            }
        },
        
        setState(nextState) {
            const prevState = this.state;
            this.state = Object.assign({}, this.state, nextState);
            this._dispatch(prevState);
            this.persist();
        },
        
        subscribe(listener) {
            this._listeners.add(listener);
            return () => this._listeners.remove(listener);
        },
        
        load() {
            const config = this.state.config;
            config.quality = String(QUALITY_HIGH);
        },
        
        persist() {
            const config = this.state.config;
            localStorage.setItem('cm_fireworks_data', JSON.stringify({
                schemaVersion: '1.2',
                data: {
                    quality: config.quality,
                    size: config.size,
                    skyLighting: config.skyLighting,
                    scaleFactor: config.scaleFactor
                }
            }));
        }

        if (typeof toggle === 'boolean') {

        }

        if (paused !== newValue) {
            store.setState({ paused: newValue });

    const COLOR_NAMES = Object.keys(COLOR);
    const COLOR_CODES = COLOR_NAMES.map(colorName => COLOR[colorName]);
    const COLOR_CODES_W_INVIS = [...COLOR_CODES, INVISIBLE];
    const COLOR_CODE_INDEXES = COLOR_CODES_W_INVIS.reduce((obj, code, i) => {
        obj[code] = i;
        return obj;
    }, {});
    const COLOR_TUPLES = {};
    COLOR_CODES.forEach(hex => {
        COLOR_TUPLES[hex] = {
            r: parseInt(hex.substr(1, 2), 16),
            g: parseInt(hex.substr(3, 2), 16),
            b: parseInt(hex.substr(5, 2), 16),
        };
    });

    function randomColorSimple() {
        return COLOR_CODES[Math.random() * COLOR_CODES.length | 0];
    }

    let lastColor;
    function randomColor(options) {
        const notSame = options && options.notSame;
        const notColor = options && options.notColor;
        const limitWhite = options && options.limitWhite;
        let color = randomColorSimple();
        
        if (limitWhite && color === COLOR.White && Math.random() < 0.6) {
            color = randomColorSimple();
        }
        
        if (notSame) {
            while (color === lastColor) {
                color = randomColorSimple();
            }
        }
        else if (notColor) {
            while (color === notColor) {
                color = randomColorSimple();
            }
        }
        
        lastColor = color;
        return color;
    }

    function whiteOrGold() {
        return Math.random() < 0.5 ? COLOR.Gold : COLOR.White;
    }

    function makePistilColor(shellColor) {
        return (shellColor === COLOR.White || shellColor === COLOR.Gold) ? randomColor({ notColor: shellColor }) : whiteOrGold();
    }

    const crysanthemumShell = (size=1) => {
        const glitter = Math.random() < 0.35;
        const singleColor = Math.random() < 0.72;
        const color = singleColor ? randomColor({ limitWhite: true }) : [randomColor(), randomColor({ notSame: true })];
        const pistil = singleColor && Math.random() < 0.42;
        const pistilColor = pistil && makePistilColor(color);
        const secondColor = singleColor && (Math.random() < 0.2 || color === COLOR.White) ? pistilColor || randomColor({ notColor: color, limitWhite: true }) : null;
        const streamers = !pistil && color !== COLOR.White && Math.random() < 0.42;
        
        let starDensity = 1.6; 
        return {
            shellSize: size,
            spreadSize: 320 + size * 110,
            starLife: 1000 + size * 200,
            starDensity,
            color,
            secondColor,
            glitter: glitter ? 'light' : '',

            pistil,

            streamers

    function startCountdownSequence() {
        const numElem = document.getElementById('countdown-number');
        const overlay = document.getElementById('countdown-overlay');
        const hnykBanner = document.getElementById('hnyk-banner');
        const welcomeBanner = document.getElementById('welcome-banner');

        const targetDate = new Date('January 1, 2027 00:00:00').getTime();

        const updateTimer = () => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                clearInterval(timerInterval);
                numElem.textContent = "00:00:00:00";
                
                overlay.classList.add('smooth-exit');
                appNodes.controls.classList.add('fireworks-active');
                
                // 1. Ipakita ang Happy New Year Everyone banner sa loob ng 5 segundo
                hnykBanner.classList.add('show');
                setTimeout(() => {
                    hnykBanner.classList.remove('show');
                    
                    // 2. Pagkatapos mawala, ipakita naman ang Welcome 2027 banner nang mga 5 segundo
                    setTimeout(() => {
                        welcomeBanner.classList.add('show');
                        setTimeout(() => {
                            welcomeBanner.classList.remove('show');
                        }, 5000);
                    }, 300); // Kaunting delay bago lumitaw ang sunod na text
                }, 5000);

                store.setState({ paused: false, soundEnabled: true });
                store.setState({ config: Object.assign({}, store.state.config, { finale: true, autoLaunch: true }) });
                
                // Start one shell immediately; the normal finale loop takes over smoothly.
                seqRandomFastShell();
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            numElem.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
        };

        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);

        const enterFullscreenFromUserClick = () => {
            // Fullscreen can only be requested from a user gesture.
            // This uses the browser Fullscreen API and does not change device/system settings.
            if (fullscreenEnabled() && !isFullscreen()) {
                fscreen.requestFullscreen(document.documentElement).catch(() => {});
            }
        };

        // The overlay already receives the tap. Do not also attach a click handler
        // to the number: the old setup caused the number click to bubble to the
        // overlay and execute the launch path twice, which could create a short
        // frame drop on phones.
        let countdownLaunchStarted = false;

        overlay.addEventListener('click', (event) => {
            if (countdownLaunchStarted) return;
            countdownLaunchStarted = true;

            // Keep the user-gesture fullscreen request, but perform the expensive
            // fireworks state/launch work on the next paint frame so fullscreen
            // layout work and canvas work do not happen in the same JS turn.
            enterFullscreenFromUserClick();

            clearInterval(timerInterval);
            overlay.classList.add('smooth-exit');
            appNodes.controls.classList.add('fireworks-active');

            hnykBanner.classList.add('show');
            setTimeout(() => {
                hnykBanner.classList.remove('show');

                setTimeout(() => {
                    welcomeBanner.classList.add('show');
                    setTimeout(() => {
                        welcomeBanner.classList.remove('show');
                    }, 5000);
                }, 300);
            }, 5000);

            requestAnimationFrame(() => {
                store.setState({ paused: false, soundEnabled: true });
                store.setState({ config: Object.assign({}, store.state.config, { finale: true, autoLaunch: true }) });
                // Start one shell once; the normal finale loop takes over smoothly.
                seqRandomFastShell();
            });
        });
    }

    function fitShellPositionInBoundsH(position) {
        const edge = 0.18;
        return (1 - edge*2) * position + edge;
    }

    function fitShellPositionInBoundsV(position) {
        return position * 0.75;
    }

    function getRandomShellPositionH() {
        return fitShellPositionInBoundsH(Math.random());
    }

    function getRandomShellPositionV() {
        return fitShellPositionInBoundsV(Math.random());
    }

    function getRandomShellSize() {
        const baseSize = shellSizeSelector();
        const maxVariance = Math.min(2.5, baseSize);
        const variance = Math.random() * maxVariance;
        const size = baseSize - variance;
        const height = maxVariance === 0 ? Math.random() : 1 - (variance / maxVariance);
        const centerOffset = Math.random() * (1 - height * 0.65) * 0.5;
        const x = Math.random() < 0.5 ? 0.5 - centerOffset : 0.5 + centerOffset;
        return {
            size,
            x: fitShellPositionInBoundsH(x),
            height: fitShellPositionInBoundsV(height)
        };
    }

    function launchShellFromConfig(event) {
        const shell = new Shell(shellFromConfig(shellSizeSelector()));
        const w = mainStage.width;
        const h = mainStage.height;
        
        shell.launch(
            event ? event.x / w : getRandomShellPositionH(),
            event ? 1 - event.y / h : getRandomShellPositionV()
        );
    }

    function seqRandomShell() {
        const size = getRandomShellSize();
        const shell = new Shell(shellFromConfig(size.size));
        shell.launch(size.x, size.height);
        
        let extraDelay = shell.starLife;
        if (shell.fallingLeaves) {
            extraDelay = 4600;
        }
        
        return 900 + Math.random() * 600 + extraDelay;
    }

    function seqRandomFastShell() {
        const shellType = randomFastShell();
        const size = getRandomShellSize();
        const shell = new Shell(shellType(size.size));
        shell.launch(size.x, size.height);
        let extraDelay = shell.starLife;
        return 900 + Math.random() * 600 + extraDelay;
    }

    function seqTwoRandom() {
        const size1 = getRandomShellSize();
        const size2 = getRandomShellSize();
        const shell1 = new Shell(shellFromConfig(size1.size));
        const shell2 = new Shell(shellFromConfig(size2.size));
        const leftOffset = Math.random() * 0.2 - 0.1;
        const rightOffset = Math.random() * 0.2 - 0.1;
        shell1.launch(0.3 + leftOffset, size1.height);
        setTimeout(() => {
            shell2.launch(0.7 + rightOffset, size2.height);
        }, 100);
        
        let extraDelay = Math.max(shell1.starLife, shell2.starLife);
        if (shell1.fallingLeaves || shell2.fallingLeaves) {
            extraDelay = 4600;
        }
        
        return 900 + Math.random() * 600 + extraDelay;
    }

    function seqTriple() {
        const shellType = randomFastShell();
        const baseSize = shellSizeSelector();
        const smallSize = Math.max(0, baseSize - 1.25);
        const offset = Math.random() * 0.08 - 0.04;
        const shell1 = new Shell(shellType(baseSize));
        shell1.launch(0.5 + offset, 0.7);
        
        const leftDelay = 1000 + Math.random() * 400;
        const rightDelay = 1000 + Math.random() * 400;
        
        setTimeout(() => {
            const offset = Math.random() * 0.08 - 0.04;
            const shell2 = new Shell(shellType(smallSize));
            shell2.launch(0.2 + offset, 0.1);
        }, leftDelay);
        
        setTimeout(() => {
            const offset = Math.random() * 0.08 - 0.04;
            const shell3 = new Shell(shellType(smallSize));
            shell3.launch(0.8 + offset, 0.1);
        }, rightDelay);
        
        return 4000;
    }

    function seqPyramid() {
        const barrageCountHalf = IS_DESKTOP ? 7 : 4;
        const largeSize = shellSizeSelector();
        const smallSize = Math.max(0, largeSize - 3);
        const randomMainShell = Math.random() < 0.78 ? crysanthemumShell : ringShell;
        const randomSpecialShell = randomShell;

        function launchShell(x, useSpecial) {
            const isRandom = shellNameSelector() === 'Random';
            let shellType = isRandom
                ? useSpecial ? randomSpecialShell : randomMainShell
                : shellTypes[shellNameSelector()];
            const shell = new Shell(shellType(useSpecial ? largeSize : smallSize));
            const height = x <= 0.5 ? x / 0.5 : (1 - x) / 0.5;
            shell.launch(x, useSpecial ? 0.75 : height * 0.42);
        }
        
        let count = 0;
        let delay = 0;
        while(count <= barrageCountHalf) {
            if (count === barrageCountHalf) {
                setTimeout(() => {
                    launchShell(0.5, true);
                }, delay);
            } else {
                const offset = count / barrageCountHalf * 0.5;
                const delayOffset = Math.random() * 30 + 30;
                setTimeout(() => {
                    launchShell(offset, false);
                }, delay);
                setTimeout(() => {
                    launchShell(1 - offset, false);
                }, delay + delayOffset);
            }
            count++;
            delay += 200;
        }
        return 3400 + barrageCountHalf * 250;
    }

    function seqSmallBarrage() {
        seqSmallBarrage.lastCalled = Date.now();
        const barrageCount = IS_DESKTOP ? 11 : 5;
        const specialIndex = IS_DESKTOP ? 3 : 1;
        const shellSize = Math.max(0, shellSizeSelector() - 2);
        const randomMainShell = Math.random() < 0.78 ? crysanthemumShell : ringShell;
        const randomSpecialShell = randomFastShell();
        
        function launchShell(x, useSpecial) {
            const isRandom = shellNameSelector() === 'Random';
            let shellType = isRandom
                ? useSpecial ? randomSpecialShell : randomMainShell
                : shellTypes[shellNameSelector()];
            const shell = new Shell(shellType(shellSize));
            const height = (Math.cos(x*5*Math.PI + PI_HALF) + 1) / 2;
            shell.launch(x, height * 0.75);
        }
        
        let count = 0;
        let delay = 0;
        while(count < barrageCount) {
            if (count === 0) {
                launchShell(0.5, false)
                count += 1;
            }
            else {
                const offset = (count + 1) / barrageCount / 2;
                const delayOffset = Math.random() * 30 + 30;
                const useSpecial = count === specialIndex;
                setTimeout(() => {
                    launchShell(0.5 + offset, useSpecial);
                }, delay);
                setTimeout(() => {
                    launchShell(0.5 - offset, useSpecial);
                }, delay + delayOffset);
                count += 2;
            }
            delay += 200;
        }
        return 3400 + barrageCount * 120;
    }
    seqSmallBarrage.cooldown = 15000;
    seqSmallBarrage.lastCalled = Date.now();

    const sequences = [
        seqRandomShell,
        seqTwoRandom,
        seqTriple,
        seqPyramid,
        seqSmallBarrage
    ];

    let isFirstSeq = true;
    // Staged finale launch timing: one firework at a time.
    // First 5 launches: 2s apart.
    // Next 10 launches: 1s apart.
    // After that: 0.7s apart.
    const finaleFirstPhaseCount = 5;
    const finaleSecondPhaseCount = 10;
    const finaleSlowInterval = 2000;
    const finaleMediumInterval = 1000;
    const finaleFastInterval = 700;
    // After reaching 0.7s: stay at 0.7s for 20s, then 0.2s for 45s,
    // then return to 0.7s for 30s and end the automatic fireworks show.
    const finaleBurstInterval = 200;
    const finalePhase20s = 20000;
    const finalePhase45s = 45000;
    const finaleFinalPhase = 30000;
    let currentFinaleCount = 0;
    let finaleFastPhaseStart = null;
    function startSequence() {
        if (isFirstSeq) {
            isFirstSeq = false;
            if (IS_HEADER) {
                return seqTwoRandom();
            }
            else {
                const shell = new Shell(crysanthemumShell(shellSizeSelector()));
                shell.launch(0.5, 0.5);
                return 2400;
            }
        }
        
        if (finaleSelector()) {
            // Keep the existing firework system; only the launch spacing changes.
            // Exactly one firework is launched on each sequence call.
            seqRandomFastShell();
            currentFinaleCount++;

            if (currentFinaleCount <= finaleFirstPhaseCount) {
                return finaleSlowInterval;
            }

            if (currentFinaleCount <= finaleFirstPhaseCount + finaleSecondPhaseCount) {
                return finaleMediumInterval;
            }

            // Start the timed finale phases when the 0.7s stage begins.
            if (finaleFastPhaseStart === null) {
                finaleFastPhaseStart = Date.now();
            }

            const elapsed = Date.now() - finaleFastPhaseStart;

            // 0.7s for the first 20 seconds.
            if (elapsed < finalePhase20s) {
                return finaleFastInterval;
            }

            // 0.2s rapid-fire phase for the next 45 seconds.
            if (elapsed < finalePhase20s + finalePhase45s) {
                return finaleBurstInterval;
            }

            // Return to 0.7s for the final 30 seconds.
            if (elapsed < finalePhase20s + finalePhase45s + finaleFinalPhase) {
                return finaleFastInterval;
            }

            // End only the automatic finale launch; leave the rest of the system untouched.
            if (store.state.config.autoLaunch) {
                store.state.config.autoLaunch = false;
            }
            return 999999999;
        }
        
        const rand = Math.random();
        if (rand < 0.08 && Date.now() - seqSmallBarrage.lastCalled > seqSmallBarrage.cooldown) {
            return seqSmallBarrage();
        }
        if (rand < 0.1) {
            return seqPyramid();
        }
        if (rand < 0.6 && !IS_HEADER) {
            return seqRandomShell();
        }
        else if (rand < 0.8) {
            return seqTwoRandom();
        }
        else if (rand < 1) {
            return seqTriple();
        }
    }

    let activePointerCount = 0;
    let isUpdatingSpeed = false;

    function handlePointerStart(event) {
        activePointerCount++;
        const btnSize = 50;
        
        if (event.y < btnSize) {
            if (event.x < btnSize) {
                togglePause();
                return;
            }
            if (event.x > mainStage.width/2 - btnSize/2 && event.x < mainStage.width/2 + btnSize/2) {
                toggleSound();
                return;
            }
            if (event.x > mainStage.width - btnSize) {
                toggleMenu();
                return;
            }
        }
        
        if (!isRunning()) return;
        
        if (updateSpeedFromEvent(event)) {
            isUpdatingSpeed = true;
        }
        else if (event.onCanvas) {
            launchShellFromConfig(event);
        }
    }

    function handlePointerEnd(event) {
        activePointerCount--;
        isUpdatingSpeed = false;
    }

    function handlePointerMove(event) {
        if (!isRunning()) return;
        if (isUpdatingSpeed) {
            updateSpeedFromEvent(event);
        }
    }

    function handleKeydown(event) {
        if (event.keyCode === 80) {
            togglePause();
        }
        else if (event.keyCode === 79) {
            toggleMenu();
        }
        else if (event.keyCode === 27) {
            toggleMenu(false);
        }
    }

    mainStage.addEventListener('pointerstart', handlePointerStart);
    mainStage.addEventListener('pointerend', handlePointerEnd);
    mainStage.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('keydown', handleKeydown);

    function handleResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const containerW = Math.min(w, MAX_WIDTH);
        const containerH = w <= 420 ? h : Math.min(h, MAX_HEIGHT);
        appNodes.stageContainer.style.width = containerW + 'px';
        appNodes.stageContainer.style.height = containerH + 'px';
        stages.forEach(stage => stage.resize(containerW, containerH));
        const scaleFactor = scaleFactorSelector();
        stageW = containerW / scaleFactor;
        stageH = containerH / scaleFactor;
    }

    handleResize();
    window.addEventListener('resize', handleResize);

    let currentFrame = 0;
    let speedBarOpacity = 0;
    let autoLaunchTime = 0;

    function updateSpeedFromEvent(event) {
        if (isUpdatingSpeed || event.y >= mainStage.height - 44) {
            const edge = 16;
            const newSpeed = (event.x - edge) / (mainStage.width - edge * 2);
            simSpeed = Math.min(Math.max(newSpeed, 0), 1);
            speedBarOpacity = 1;
            return true;
        }
        return false;
    }

    function updateGlobals(timeStep, lag) {
        currentFrame++;
        if (!isUpdatingSpeed) {
            speedBarOpacity -= lag / 30;
            if (speedBarOpacity < 0) {
                speedBarOpacity = 0;
            }
        }
        
        if (store.state.config.autoLaunch) {
            autoLaunchTime -= timeStep;
            if (autoLaunchTime <= 0) {
                autoLaunchTime = startSequence() * 1.0;
            }
        }
    }

    function update(frameTime, lag) {
        if (!isRunning()) return;
        
        const width = stageW;
        const height = stageH;
        const timeStep = frameTime * simSpeed;
        const speed = simSpeed * lag;
        
        updateGlobals(timeStep, lag);
        
        const starDrag = 1 - (1 - Star.airDrag) * speed;
        const starDragHeavy = 1 - (1 - Star.airDragHeavy) * speed;
        const sparkDrag = 1 - (1 - Spark.airDrag) * speed;
        const gAcc = timeStep / 1000 * GRAVITY;
        let activeSparkCount = 0;
        COLOR_CODES.forEach(sparkColor => {
            activeSparkCount += Spark.active[sparkColor].length;
        });
        let sparkBudget = Math.max(0, MAX_ACTIVE_SPARKS - activeSparkCount);
        COLOR_CODES_W_INVIS.forEach(color => {
            const stars = Star.active[color];
            for (let i=stars.length-1; i>=0; i=i-1) {
                const star = stars[i];
                if (star.updateFrame === currentFrame) {
                    continue;
                }
                star.updateFrame = currentFrame;
                
                star.life -= timeStep;
                if (star.life <= 0) {
                    stars.splice(i, 1);
                    Star.returnInstance(star);
                } else {
                    const burnRate = Math.pow(star.life / star.fullLife, 0.5);
                    const burnRateInverse = 1 - burnRate;

                    star.prevX = star.x;
                    star.prevY = star.y;
                    star.x += star.speedX * speed;
                    star.y += star.speedY * speed;
                    if (!star.heavy) {
                        star.speedX *= starDrag;
                        star.speedY *= starDrag;
                    }
                    else {
                        star.speedX *= starDragHeavy;
                        star.speedY *= starDragHeavy;
                    }
                    star.speedY += gAcc;
                    
                    if (star.spinRadius) {
                        star.spinAngle += star.spinSpeed * speed;
                        star.x += Math.sin(star.spinAngle) * star.spinRadius * speed;
                        star.y += Math.cos(star.spinAngle) * star.spinRadius * speed;
                    }
                    
                    if (star.sparkFreq) {
                        star.sparkTimer -= timeStep;
                        while (star.sparkTimer < 0) {
                            star.sparkTimer += star.sparkFreq * 0.75 + star.sparkFreq * burnRateInverse * 4;
                            // Sparks are the fastest-growing particle pool.
                            // Once the active budget is reached, skip only the
                            // extra spark—not the firework star itself.
                            if (sparkBudget > 0) {
                                Spark.add(
                                    star.x,
                                    star.y,
                                    star.sparkColor,
                                    Math.random() * PI_2,
                                    Math.random() * star.sparkSpeed * burnRate,
                                    star.sparkLife * 0.8 + Math.random() * star.sparkLifeVariation * star.sparkLife
                                );
                                sparkBudget--;
                            }
                        }
                    }
                    
                    if (star.life < star.transitionTime) {
                        if (star.secondColor && !star.colorChanged) {
                            star.colorChanged = true;
                            star.color = star.secondColor;
                            stars.splice(i, 1);
                            Star.active[star.secondColor].push(star);
                            if (star.secondColor === INVISIBLE) {
                                star.sparkFreq = 0;
                            }
                        }
                        
                        if (star.strobe) {
                            star.visible = Math.floor(star.life / star.strobeFreq) % 3 === 0;
                        }
                    }
                }
            }
                                                
            const sparks = Spark.active[color];
            for (let i=sparks.length-1; i>=0; i=i-1) {
                const spark = sparks[i];
                spark.life -= timeStep;
                if (spark.life <= 0) {
                    sparks.splice(i, 1);
                    Spark.returnInstance(spark);
                } else {
                    spark.prevX = spark.x;
                    spark.prevY = spark.y;
                    spark.x += spark.speedX * speed;
                    spark.y += spark.speedY * speed;
                    spark.speedX *= sparkDrag;
                    spark.speedY *= sparkDrag;
                    spark.speedY += gAcc;
                }
            }
        });
        
        render(speed);
    }

    function render(speed) {
        const { dpr } = mainStage;
        const width = stageW;
        const height = stageH;
        const trailsCtx = trailsStage.ctx;
        const mainCtx = mainStage.ctx;
        
        if (skyLightingSelector() !== SKY_LIGHT_NONE) {
            colorSky(speed);
        }
        
        const scaleFactor = scaleFactorSelector();
        trailsCtx.scale(dpr * scaleFactor, dpr * scaleFactor);
        mainCtx.scale(dpr * scaleFactor, dpr * scaleFactor);
        
        trailsCtx.globalCompositeOperation = 'source-over';
        trailsCtx.fillStyle = `rgba(0, 0, 0, ${store.state.config.longExposure ? 0.0025 : 0.175 * speed})`;
        trailsCtx.fillRect(0, 0, width, height);
        
        mainCtx.clearRect(0, 0, width, height);
        
        // Realistic explosion bloom: a very short white-hot core followed by
        // a soft warm halo. Keeping the bloom alive for a few frames makes the
        // light feel like it actually illuminates the sky instead of flashing
        // for only one frame.
        for (let i = BurstFlash.active.length - 1; i >= 0; i--) {
            const bf = BurstFlash.active[i];
            bf.life -= Math.max(0.055, speed * 0.12);

            if (bf.life <= 0) {
                BurstFlash.active.splice(i, 1);
                BurstFlash.returnInstance(bf);
                continue;
            }

            const fade = bf.life;
            const glowRadius = bf.radius * (1.05 + (1 - fade) * 1.35);

            trailsCtx.globalCompositeOperation = 'lighter';
            const burstGradient = trailsCtx.createRadialGradient(
                bf.x, bf.y, 0,
                bf.x, bf.y, glowRadius
            );
            burstGradient.addColorStop(0, `rgba(255,255,255,${0.98 * fade})`);
            burstGradient.addColorStop(0.035, `rgba(255,250,220,${0.92 * fade})`);
            burstGradient.addColorStop(0.12, `rgba(255,205,105,${0.34 * fade})`);
            burstGradient.addColorStop(0.34, `rgba(255,145,35,${0.13 * fade})`);
            burstGradient.addColorStop(0.68, `rgba(255,110,20,${0.045 * fade})`);
            burstGradient.addColorStop(1, 'rgba(255,90,10,0)');

            trailsCtx.fillStyle = burstGradient;
            trailsCtx.fillRect(
                bf.x - glowRadius,
                bf.y - glowRadius,
                glowRadius * 2,
                glowRadius * 2
            );

            // Tiny white-hot center on the main canvas for a camera-like flash.
            const coreRadius = Math.max(1.5, bf.radius * 0.055);
            const core = mainCtx.createRadialGradient(
                bf.x, bf.y, 0,
                bf.x, bf.y, coreRadius * 3.2
            );
            core.addColorStop(0, `rgba(255,255,255,${0.95 * fade})`);
            core.addColorStop(0.18, `rgba(255,248,220,${0.65 * fade})`);
            core.addColorStop(1, 'rgba(255,255,255,0)');
            mainCtx.globalCompositeOperation = 'lighter';
            mainCtx.fillStyle = core;
            mainCtx.fillRect(
                bf.x - coreRadius * 3.2,
                bf.y - coreRadius * 3.2,
                coreRadius * 6.4,
                coreRadius * 6.4
            );
        }
        trailsCtx.globalCompositeOperation = 'lighten';
        mainCtx.globalCompositeOperation = 'source-over';
        
        trailsCtx.globalCompositeOperation = 'lighten';
        
        trailsCtx.lineWidth = Star.drawWidth;
        trailsCtx.lineCap = 'round';
        // A slightly brighter core makes each burning star read like a real
        // incandescent particle while keeping the existing particle count.
        mainCtx.globalCompositeOperation = 'lighter';
        mainCtx.strokeStyle = '#fff';
        mainCtx.lineWidth = 1;
        mainCtx.beginPath();
        COLOR_CODES.forEach(color => {
            const stars = Star.active[color];
            trailsCtx.strokeStyle = color;
            trailsCtx.beginPath();
            stars.forEach(star => {
                if (star.visible) {
                    trailsCtx.moveTo(star.x, star.y);
                    trailsCtx.lineTo(star.prevX, star.prevY);
                    mainCtx.moveTo(star.x, star.y);
                    mainCtx.lineTo(star.x - star.speedX * 1.6, star.y - star.speedY * 1.6);
                }
            });
            trailsCtx.stroke();
        });
        mainCtx.stroke();
        mainCtx.globalCompositeOperation = 'source-over';

        trailsCtx.lineWidth = Spark.drawWidth;
        trailsCtx.lineCap = 'butt';
        COLOR_CODES.forEach(color => {
            const sparks = Spark.active[color];
            trailsCtx.strokeStyle = color;
            trailsCtx.beginPath();
            sparks.forEach(spark => {
                trailsCtx.moveTo(spark.x, spark.y);
                trailsCtx.lineTo(spark.prevX, spark.prevY);
            });
            trailsCtx.stroke();
        });
        
        if (speedBarOpacity) {
            const speedBarHeight = 6;
            mainCtx.globalAlpha = speedBarOpacity;
            mainCtx.fillStyle = COLOR.Blue;
            mainCtx.fillRect(0, height - speedBarHeight, width * simSpeed, speedBarHeight);
            mainCtx.globalAlpha = 1;
        }
        
        trailsCtx.setTransform(1, 0, 0, 1, 0, 0);
        mainCtx.setTransform(1, 0, 0, 1, 0, 0);
    }

    const currentSkyColor = { r: 0, g: 0, b: 0 };
    const targetSkyColor = { r: 0, g: 0, b: 0 };
    function colorSky(speed) {
        const maxSkySaturation = skyLightingSelector() * 15;
        const maxStarCount = 500;
        let totalStarCount = 0;
        targetSkyColor.r = 0;
        targetSkyColor.g = 0;
        targetSkyColor.b = 0;
        
        COLOR_CODES.forEach(color => {
            const tuple = COLOR_TUPLES[color];
            const count = Star.active[color].length;
            totalStarCount += count;
            targetSkyColor.r += tuple.r * count;
            targetSkyColor.g += tuple.g * count;
            targetSkyColor.b += tuple.b * count;
        });
        
        const intensity = Math.pow(Math.min(1, totalStarCount / maxStarCount), 0.3);
        const maxColorComponent = Math.max(1, targetSkyColor.r, targetSkyColor.g, targetSkyColor.b);
        targetSkyColor.r = targetSkyColor.r / maxColorComponent * maxSkySaturation * intensity;
        targetSkyColor.g = targetSkyColor.g / maxColorComponent * maxSkySaturation * intensity;
        targetSkyColor.b = targetSkyColor.b / maxColorComponent * maxSkySaturation * intensity;
        
        const colorChange = 10;
        currentSkyColor.r += (targetSkyColor.r - currentSkyColor.r) / colorChange * speed;
        currentSkyColor.g += (targetSkyColor.g - currentSkyColor.g) / colorChange * speed;
        currentSkyColor.b += (targetSkyColor.b - currentSkyColor.b) / colorChange * speed;
        
        appNodes.canvasContainer.style.backgroundColor = `rgb(${currentSkyColor.r | 0}, ${currentSkyColor.g | 0}, ${currentSkyColor.b | 0})`;
    }

    mainStage.addEventListener('ticker', update);

    function createParticleArc(start, arcLength, count, randomness, particleFactory) {
        const angleDelta = arcLength / count;
        const end = start + arcLength - (angleDelta * 0.5);
        
        if (end > start) {
            for (let angle=start; angle<end; angle=angle+angleDelta) {
                particleFactory(angle + Math.random() * angleDelta * randomness);
            }
        } else {
            for (let angle=start; angle>end; angle=angle+angleDelta) {
                particleFactory(angle + Math.random() * angleDelta * randomness);
            }
        }
    }

    function createBurst(count, particleFactory, startAngle=0, arcLength=PI_2) {
        const R = 0.5 * Math.sqrt(count/Math.PI);
        const C = 2 * R * Math.PI;
        const C_HALF = C / 2;
        
        for (let i=0; i<=C_HALF; i++) {
            const ringAngle = i / C_HALF * PI_HALF;
            const ringSize = Math.cos(ringAngle);
            const partsPerFullRing = C * ringSize;
            const partsPerArc = partsPerFullRing * (arcLength / PI_2);
            
            const angleInc = PI_2 / partsPerFullRing;
            const angleOffset = Math.random() * angleInc + startAngle;
            const maxRandomAngleOffset = angleInc * 0.33;
            
            for (let i=0; i<partsPerArc; i++) {
                const randomAngleOffset = Math.random() * maxRandomAngleOffset;
                let angle = angleInc * i + angleOffset + randomAngleOffset;
                particleFactory(angle, ringSize);
            }
        }
    }

    function crossetteEffect(star) {
        const startAngle = Math.random() * PI_HALF;
        createParticleArc(startAngle, PI_2, 4, 0.5, (angle) => {
            Star.add(star.x, star.y, star.color, angle, Math.random() * 0.6 + 0.75, 600);
        });
    }

    function floralEffect(star) {
        const count = 18;
        createBurst(count, (angle, speedMult) => {
            Star.add(star.x, star.y, star.color, angle, speedMult * 2.4, 1000 + Math.random() * 300, star.speedX, star.speedY);
        });
        BurstFlash.add(star.x, star.y, 46);
        soundManager.playSound('burstSmall');
    }

    // Falling Leaves is intentionally capped because several simultaneous bursts
    // can otherwise create a large number of long-lived stars + sparks on phones.
    let fallingLeafActiveCount = 0;
    const FALLING_LEAF_MAX = 18;

    function fallingLeavesEffect(star) {
        const remaining = Math.max(0, FALLING_LEAF_MAX - fallingLeafActiveCount);
        if (remaining > 0) {
            // Fewer leaves are emitted as the global leaf count rises. This keeps
            // one Falling Leaves shell looking natural while preventing a pile-up
            // when many shells burst together at the top.
            const leafCount = Math.min(5, remaining);
            createBurst(leafCount, (angle, speedMult) => {
                if (fallingLeafActiveCount >= FALLING_LEAF_MAX) return;
                const newStar = Star.add(
                    star.x, star.y, INVISIBLE, angle,
                    speedMult * 2.05,
                    1250 + Math.random() * 300,
                    star.speedX, star.speedY
                );
                newStar.isFallingLeaf = true;
                fallingLeafActiveCount++;
                newStar.sparkColor = COLOR.Gold;
                // Much less frequent sparks, but still enough for the falling-leaf glow.
                newStar.sparkFreq = 18;
                newStar.sparkSpeed = 0.22;
                newStar.sparkLife = 360;
                newStar.sparkLifeVariation = 1.8;
            });
        }
        BurstFlash.add(star.x, star.y, 40);
        soundManager.playSound('burstSmall');
    }

    function crackleEffect(star) {
        const count = 36;
        createParticleArc(0, PI_2, count, 1.8, (angle) => {
            Spark.add(star.x, star.y, COLOR.Gold, angle, Math.pow(Math.random(), 0.45) * 2.4, 300 + Math.random() * 200);
        });
    }

    class Shell {
        constructor(options) {
            Object.assign(this, options);
            this.starLifeVariation = options.starLifeVariation || 0.125;
            this.color = options.color || randomColor();
            this.glitterColor = options.glitterColor || this.color;
                    
            if (!this.starCount) {
                const density = options.starDensity || 1.4;
                const scaledSize = this.spreadSize / 54;
                this.starCount = Math.max(8, scaledSize * scaledSize * density);
            }
        }
        
        launch(position, launchHeight) {
            const width = stageW;
            const height = stageH;
            const hpad = 60;
            const vpad = 50;
            const minHeightPercent = 0.45;
            const minHeight = height - height * minHeightPercent;
            
            const launchX = position * (width - hpad * 2) + hpad;
            const launchY = height;
            const burstY = minHeight - (launchHeight * (minHeight - vpad));
            const launchDistance = launchY - burstY;
            const launchVelocity = Math.pow(launchDistance * 0.04, 0.64) * 1.15;
            
            const comet = this.comet = Star.add(
                launchX,
                launchY,
                typeof this.color === 'string' && this.color !== 'random' ? this.color : COLOR.White,
                Math.PI,
                launchVelocity * (this.horsetail ? 1.2 : 1),
                launchVelocity * (this.horsetail ? 100 : 400)
            );
            
            comet.heavy = true;
            comet.spinRadius = MyMath.random(0.32, 0.85);
            comet.sparkFreq = 6;
            comet.sparkLife = 320;
            comet.sparkLifeVariation = 3;
            if (this.glitter === 'willow' || this.fallingLeaves) {
                comet.sparkFreq = 8;
                comet.sparkSpeed = 0.5;
                comet.sparkLife = 500;
            }
            if (this.color === INVISIBLE) {
                comet.sparkColor = COLOR.Gold;
            }
            
            if (Math.random() > 0.4 && !this.horsetail) {
                comet.secondColor = INVISIBLE;
                comet.transitionTime = Math.pow(Math.random(), 1.5) * 700 + 500;
            }
            
            comet.onDeath = comet => this.burst(comet.x, comet.y);
            soundManager.playSound('lift');
        }
        
        burst(x, y) {
            const speed = (this.spreadSize / 96) * 1.1;
            let color, onDeath, sparkFreq, sparkSpeed, sparkLife;
            let sparkLifeVariation = 0.25;
            let playedDeathSound = false;
            
            if (this.crossette) onDeath = (star) => {
                if (!playedDeathSound) {
                    soundManager.playSound('crackleSmall');
                    playedDeathSound = true;
                }
                crossetteEffect(star);
            }
            if (this.crackle) onDeath = (star) => {
                if (!playedDeathSound) {
                    soundManager.playSound('crackle');
                    playedDeathSound = true;
                }
                crackleEffect(star);
            }
            if (this.floral) onDeath = floralEffect;
            if (this.fallingLeaves) onDeath = fallingLeavesEffect;
            
            if (this.glitter === 'light') {
                sparkFreq = 120; sparkSpeed = 0.3; sparkLife = 300; sparkLifeVariation = 2;
            } else if (this.glitter === 'medium') {
                sparkFreq = 60; sparkSpeed = 0.44; sparkLife = 700; sparkLifeVariation = 2;
            } else if (this.glitter === 'heavy') {
                sparkFreq = 25; sparkSpeed = 0.8; sparkLife = 1400; sparkLifeVariation = 2;
            } else if (this.glitter === 'thick') {
                sparkFreq = 10; sparkSpeed = 1.65; sparkLife = 1400; sparkLifeVariation = 3;
            } else if (this.glitter === 'streamer') {
                sparkFreq = 15; sparkSpeed = 1.05; sparkLife = 620; sparkLifeVariation = 2;
            } else if (this.glitter === 'willow') {
                sparkFreq = 40; sparkSpeed = 0.34; sparkLife = 1400; sparkLifeVariation = 3.8;
            }
            
            const starFactory = (angle, speedMult) => {
                const standardInitialSpeed = this.spreadSize / 1800;
                const star = Star.add(
                    x, y,
                    color || randomColor(),
                    angle,
                    speedMult * speed,
                    this.starLife + Math.random() * this.starLife * this.starLifeVariation,
                    this.horsetail ? this.comet && this.comet.speedX : 0,
                    this.horsetail ? this.comet && this.comet.speedY : -standardInitialSpeed
                );
        
                if (this.secondColor) {
                    star.transitionTime = this.starLife * (Math.random() * 0.05 + 0.32);
                    star.secondColor = this.secondColor;
                }

                if (this.strobe) {
                    star.transitionTime = this.starLife * (Math.random() * 0.08 + 0.46);
                    star.strobe = true;
                    star.strobeFreq = Math.random() * 20 + 40;
                    if (this.strobeColor) {
                        star.secondColor = this.strobeColor;
                    }
                }
                
                star.onDeath = onDeath;

                if (this.glitter) {
                    star.sparkFreq = sparkFreq;
                    star.sparkSpeed = sparkSpeed;
                    star.sparkLife = sparkLife;
                    star.sparkLifeVariation = sparkLifeVariation;
                    star.sparkColor = this.glitterColor;
                    star.sparkTimer = Math.random() * star.sparkFreq;
                }
            };
            
            if (typeof this.color === 'string') {
                if (this.color === 'random') {
                    color = null;
                } else {
                    color = this.color;
                }
                
                if (this.ring) {
                    const ringStartAngle = Math.random() * Math.PI;
                    const ringSquash = Math.pow(Math.random(), 2) * 0.85 + 0.15;
                    
                    createParticleArc(0, PI_2, this.starCount, 0, angle => {
                        const initSpeedX = Math.sin(angle) * speed * ringSquash;
                        const initSpeedY = Math.cos(angle) * speed;
                        const newSpeed = MyMath.pointDist(0, 0, initSpeedX, initSpeedY);
                        const newAngle = MyMath.pointAngle(0, 0, initSpeedX, initSpeedY) + ringStartAngle;
                        const star = Star.add(
                            x, y, color, newAngle, newSpeed,
                            this.starLife + Math.random() * this.starLife * this.starLifeVariation
                        );
                        
                        if (this.glitter) {
                            star.sparkFreq = sparkFreq;
                            star.sparkSpeed = sparkSpeed;
                            star.sparkLife = sparkLife;
                            star.sparkLifeVariation = sparkLifeVariation;
                            star.sparkColor = this.glitterColor;
                            star.sparkTimer = Math.random() * star.sparkFreq;
                        }
                    });
                } else {
                    createBurst(this.starCount, starFactory);
                }
            } else if (Array.isArray(this.color)) {
                if (Math.random() < 0.5) {
                    const start = Math.random() * Math.PI;
                    const start2 = start + Math.PI;
                    const arc = Math.PI;
                    color = this.color[0];
                    createBurst(this.starCount, starFactory, start, arc);
                    color = this.color[1];
                    createBurst(this.starCount, starFactory, start2, arc);
                } else {
                    color = this.color[0];
                    createBurst(this.starCount / 2, starFactory);
                    color = this.color[1];
                    createBurst(this.starCount / 2, starFactory);
                }
            } else {
                throw new Error('Invalid shell color.');
            }
            
            if (this.pistil) {
                const innerShell = new Shell({
                    spreadSize: this.spreadSize * 0.5,
                    starLife: this.starLife * 0.6,
                    starLifeVariation: this.starLifeVariation,
                    starDensity: 1.8,
                    color: this.pistilColor,
                    glitter: 'light',
                    glitterColor: this.pistilColor === COLOR.Gold ? COLOR.Gold : COLOR.White
                });
                innerShell.burst(x, y);
            }
            
            if (this.streamers) {
                const innerShell = new Shell({
                    spreadSize: this.spreadSize * 0.9,
                    starLife: this.starLife * 0.8,
                    starLifeVariation: this.starLifeVariation,
                    starCount: Math.floor(Math.max(8, this.spreadSize / 40)),
                    color: COLOR.White,
                    glitter: 'streamer'
                });
                innerShell.burst(x, y);
            }
            
            BurstFlash.add(x, y, this.spreadSize / 4);

            if (this.comet) {
                const maxDiff = 2;
                const sizeDifferenceFromMaxSize = Math.min(maxDiff, shellSizeSelector() - this.shellSize);
                const soundScale = (1 - sizeDifferenceFromMaxSize / maxDiff) * 0.3 + 0.7;
                soundManager.playSound('burst', soundScale);
            }
        }
    }

    const BurstFlash = {
        active: [],
        _pool: [],
        _new() { return {} },
        add(x, y, radius) {
            // Keep bright explosion blooms, but avoid stacking too many
            // expensive radial gradients during a busy multi-shell burst.
            if (this.active.length >= MAX_ACTIVE_BURST_FLASHES) return null;
            const instance = this._pool.pop() || this._new();
            instance.x = x;
            instance.y = y;
            instance.radius = radius;
            // Short-lived bloom so the explosion has a bright, natural-looking flash.
            instance.life = 1;
            this.active.push(instance);
            return instance;
        },
        returnInstance(instance) {
            this._pool.push(instance);
        }
    };

    function createParticleCollection() {
        const collection = {};
        COLOR_CODES_W_INVIS.forEach(color => {
            collection[color] = [];
        });
        return collection;
    }

    const Star = {
        drawWidth: 3.5,
        airDrag: 0.98,
        airDragHeavy: 0.992,
        active: createParticleCollection(),
        _pool: [],
        _new() { return {}; },
        add(x, y, color, angle, speed, life, speedOffX, speedOffY) {
            const instance = this._pool.pop() || this._new();
            instance.visible = true;
            instance.heavy = false;
            instance.x = x;
            instance.y = y;
            instance.prevX = x;
            instance.prevY = y;
            instance.color = color;
            instance.speedX = Math.sin(angle) * speed + (speedOffX || 0);
            instance.speedY = Math.cos(angle) * speed + (speedOffY || 0);
            instance.life = life;
            instance.fullLife = life;
            instance.spinAngle = Math.random() * PI_2;
            instance.spinSpeed = 0.8;
            instance.spinRadius = 0;
            instance.sparkFreq = 0;
            instance.sparkSpeed = 1;
            instance.sparkTimer = 0;
            instance.sparkColor = color;
            instance.sparkLife = 750;
            instance.sparkLifeVariation = 0.25;
            instance.strobe = false;
            instance.isFallingLeaf = false;
            this.active[color].push(instance);
            return instance;
        },
        returnInstance(instance) {
            instance.onDeath && instance.onDeath(instance);
            if (instance.isFallingLeaf) {
                fallingLeafActiveCount = Math.max(0, fallingLeafActiveCount - 1);
                instance.isFallingLeaf = false;
            }
            instance.onDeath = null;
            instance.secondColor = null;
            instance.transitionTime = 0;
            instance.colorChanged = false;
            this._pool.push(instance);
        }
    };

    const Spark = {
        drawWidth: 0,
        airDrag: 0.9,
        active: createParticleCollection(),
        _pool: [],
        _new() { return {}; },
        add(x, y, color, angle, speed, life) {
            const instance = this._pool.pop() || this._new();
            instance.x = x;
            instance.y = y;
            instance.prevX = x;
            instance.prevY = y;
            instance.color = color;
            instance.speedX = Math.sin(angle) * speed;
            instance.speedY = Math.cos(angle) * speed;
            instance.life = life;
            this.active[color].push(instance);
            return instance;
        },
        returnInstance(instance) {
            this._pool.push(instance);
        }
    };

    const soundManager = {
        baseURL: 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/',
        ctx: new (window.AudioContext || window.webkitAudioContext)(),
        sources: {
            lift: {
                volume: 1,
                playbackRateMin: 0.85,
                playbackRateMax: 0.95,
                fileNames: ['lift1.mp3', 'lift2.mp3', 'lift3.mp3']
            },
            burst: {
                volume: 1,
                playbackRateMin: 0.8,
                playbackRateMax: 0.9,
                fileNames: ['burst1.mp3', 'burst2.mp3']
            },
            burstSmall: {
                volume: 0.25,
                playbackRateMin: 0.8,
                playbackRateMax: 1,
                fileNames: ['burst-sm-1.mp3', 'burst-sm-2.mp3']
            },
            crackle: {
                volume: 0.2,
                playbackRateMin: 1,
                playbackRateMax: 1,
                fileNames: ['crackle1.mp3']
            },
            crackleSmall: {
                volume: 0.3,
                playbackRateMin: 1,
                playbackRateMax: 1,
                fileNames: ['crackle-sm-1.mp3']
            }
        },

        preload() {
            const allFilePromises = [];
            function checkStatus(response) {
                if (response.status >= 200 && response.status < 300) {
                    return response;
                }
                const customError = new Error(response.statusText);
                customError.response = response;
                throw customError;
            }

            const types = Object.keys(this.sources);
            types.forEach(type => {
                const source = this.sources[type];
                const { fileNames } = source;
                const filePromises = [];
                fileNames.forEach(fileName => {
                    const fileURL = this.baseURL + fileName;
                    const promise = fetch(fileURL)
                        .then(checkStatus)
                        .then(response => response.arrayBuffer())
                        .then(data => new Promise(resolve => {
                            this.ctx.decodeAudioData(data, resolve);
                        }));
                    filePromises.push(promise);
                    allFilePromises.push(promise);
                });

                Promise.all(filePromises).then(buffers => {
                    source.buffers = buffers;
                });
            });

            return Promise.all(allFilePromises);
        },
        
        pauseAll() {
            this.ctx.suspend();
        },

        resumeAll() {
            this.playSound('lift', 0);
            setTimeout(() => {
                this.ctx.resume();
            }, 250);
        },
        
        _lastSmallBurstTime: 0,

        playSound(type, scale=1) {
            scale = MyMath.clamp(scale, 0, 1);
            if (!canPlaySoundSelector() || simSpeed < 0.95) {
                return;
            }
            
            if (type === 'burstSmall') {
                const now = Date.now();
                if (now - this._lastSmallBurstTime < 20) {
                    return;
                }
                this._lastSmallBurstTime = now;
            }
            
            const source = this.sources[type];
            if (!source) {
                throw new Error(`Sound of type "${type}" doesn't exist.`);
            }
            
            const initialVolume = source.volume;
            const initialPlaybackRate = MyMath.random(source.playbackRateMin, source.playbackRateMax);
            const scaledVolume = initialVolume * scale;
            const scaledPlaybackRate = initialPlaybackRate * (2 - scale);
            
            const gainNode = this.ctx.createGain();
            gainNode.gain.value = scaledVolume;

            const buffer = MyMath.randomChoice(source.buffers);
            const bufferSource = this.ctx.createBufferSource();
            bufferSource.playbackRate.value = scaledPlaybackRate;
            bufferSource.buffer = buffer;
            bufferSource.connect(gainNode);
            gainNode.connect(this.ctx.destination);
            bufferSource.start(0);
        }
    };

    if (IS_HEADER) {
        init();
    } else {
        setTimeout(() => {
            init();
        }, 0);
    }
  </script>
</body>
